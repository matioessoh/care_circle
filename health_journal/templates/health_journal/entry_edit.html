{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Modifier l'entrée" %} - Care Circle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="kicker">{% trans "Journal de santé" %}</div>
        <h1 class="page-title">{% trans "Modifier l'entrée" %}</h1>
        <p class="reassurance mb-4">{% trans "Mettez à jour votre suivi." %}</p>
        <div class="cc-card">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="cc-field">
                            <label>{% trans "Date" %}</label>
                            <input type="date" name="date" value="{{ entry.date|date:'Y-m-d' }}" class="cc-input" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="cc-field">
                            <label>{% trans "Humeur" %}</label>
                            <select name="mood" class="cc-input" required>
                                {% for value, label in entry.MOOD_CHOICES %}
                                <option value="{{ value }}" {% if entry.mood == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="cc-field">
                            <label>{% trans "Heures de sommeil" %}</label>
                            <input type="number" name="sleep_hours" step="0.5" min="0" max="24" value="{{ entry.sleep_hours }}" class="cc-input">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="cc-field">
                            <label>{% trans "Niveau de douleur (0-10)" %}</label>
                            <input type="number" name="pain_level" min="0" max="10" value="{{ entry.pain_level }}" class="cc-input">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="cc-field">
                            <label>{% trans "Poids (kg)" %}</label>
                            <input type="number" name="weight" step="0.1" value="{{ entry.weight }}" class="cc-input">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="cc-field">
                            <label>{% trans "Symptômes" %}</label>
                            <textarea name="symptoms" class="cc-input" rows="3">{{ entry.symptoms }}</textarea>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="cc-field">
                            <label>{% trans "Médicaments pris" %}</label>
                            <textarea name="medications" class="cc-input" rows="3">{{ entry.medications }}</textarea>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="cc-field">
                            <label>{% trans "Notes" %}</label>
                            <textarea name="notes" class="cc-input" rows="3">{{ entry.notes }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn-cc btn-cc-primary"><i class="fas fa-save"></i> {% trans "Enregistrer" %}</button>
                    <a href="{% url 'entry_list' %}" class="btn-cc btn-cc-outline">{% trans "Annuler" %}</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
